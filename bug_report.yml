name: Bug Report
description: Report a problem with the level loader.
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: loader-version
    attributes:
      label: Loader version
      description: What version of the loader are you using?
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: error-code
    attributes:
      label: Error code (if applicable)
      description: Enter the error code displayed by the loader, if any.
      placeholder: "Enter the error code"
    validations:
      required: false

  - type: textarea
    id: issue-description
    attributes:
      label: Describe the issue
      description: Explain what went wrong and how to reproduce the problem.
      placeholder: "Describe what happened..."
    validations:
      required: true

  - type: upload
    id: level-file
    attributes:
      label: Attach the level
      description: Upload the level file, or put it in a ZIP archive if its file type is not supported. ZIP files can be up to 25 MB.
    validations:
      required: true
